<!DOCTYPE html>
<html>
  <head>
    <title>Forms</title>
  </head>
  <body>
    <h2>Forms in HTML:</h2>
    <form action="">
      <label>Enter your name :</label>
      <input type="text" minlength="5" maxlength="12" required />
      <br><br>

      <label>Enter Your last name:</label>
      <input type="text" minlength="5" maxlength="12" disabled />
      <br><br>

      <label>Enter your age:</label>
      <input type="number" value="20" />
      <br><br>

      <label>Enter your Email:</label>
      <input type="email" />
      <br><br>

      <label>Date of Joining:</label>
      <input type="date" />
      <br><br>

      <label>Enter Password:</label>
      <input type="password" required />
      <br><br>

      <label>Enter your T-shirt Sizee:</label>
      <input type="radio" name="shirtsize" id="small" /><label for="small" >Small size</label>
      <input type="radio" name="shirtsize" id="medium" checked /><label for="medium" >Medium size</label>
      <input type="radio" name="shirtsize" id="large" /><label for="large" >Large size</label>


    </form>
  </body>
</html>
