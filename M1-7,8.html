<!DOCTYPE html>
<html>
  <head>
    <title>Tables</title>
  </head>
  <body>
    <table border="">
      <caption>This table is shit...</caption>
      <colgroup>
      <col span="2" style="background-color:red"  >
      <col span="2" style="background-color:green"  >
      </colgroup>
      <thead>
      <tr>
        <th>Col-1</th>
        <th>Col-2</th>
        <th>Col-3</th>
        <th>Col-4</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td rowspan="2" >5</td>
        <td>6</td>
        <td>7</td>
        <td>8</td>
      </tr>
      <tr>
        <td>9</td>
        <td>10</td>
        <td>11</td>
        <td>12</td>
      </tr>
      <tr>
        <td colspan="2">13</td>
        <td>14</td>
        <td>15</td>
        <td>16</td>
      </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>abc</td>
          <td>def</td>
          <td>ghi</td>
          <td>jkl</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
