<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
  </head>
  <body>
    <form>
      <label>Please select the color of T-shirt:</label>
      <input type="color" value="color" />
      <br><br>

      <label for="paymentoption">Please select the payment method:</label>
    <select name="payment" id="paymentoption">
      <option value="Gpay" >Gpay</option>
      <option value="Phonepe" >Phonepay</option>
      <option value="Bharatpe" >Bharatpe</option>
      <option value="Others" >Others</option>
      </select> 

      <br><br>
      <p>Please Enter Your preffered language</p>
      <input type="checkbox" name="lang" id="english" value="english" >
      <label for="english">English</label>
      <input type="checkbox" name="lang" id="hindi" value="hindi" />
      <label for="hindi" >Hindi</label>

    <br><br>
    <label for="cmts">Please provide your valuable feedback:</label>
    <textarea name="cmt" id="cmts" placeholder="Gimme feedback" rows="20" cols="60"></textarea>

    <input type="reset" />
    <input type="submit" />
    <button>Submit</button>

    </form>
  </body>
</html>
